<ion-view view-title="Meu cadastro"
  ><ion-content class="padding"
    ><main>
      <form name="perfilForm" ng-submit="salvar(perfilForm)" novalidate>
        <label class="item item-input item-stacked-label"
          ><span class="input-label">Nome completo</span
          ><input type="text" ng-model="perfil.nome" ng-disabled="true"
        /></label>
        <label class="item item-input item-stacked-label"
          ><span class="input-label">Matrícula</span
          ><input type="text" ng-model="perfil.matricula" ng-disabled="true"
        /></label>
        <label class="item item-input item-stacked-label"
          ><span class="input-label">Curso</span
          ><input type="text" ng-model="perfil.curso" ng-disabled="true"
        /></label>
        <label class="item item-input item-stacked-label"
          ><span class="input-label">E-mail pessoal</span
          ><input type="email" ng-model="perfil.email" required
        /></label>
        <label class="item item-input item-stacked-label"
          ><span class="input-label">Telefone / WhatsApp</span
          ><input type="tel" ng-model="perfil.telefone" required
        /></label>
        <label class="item item-input item-stacked-label"
          ><span class="input-label">CEP</span
          ><input type="text" ng-model="perfil.cep" required
        /></label>
        <label class="item item-input item-stacked-label"
          ><span class="input-label">Rua e número</span
          ><input type="text" ng-model="perfil.rua" required
        /></label>
        <label class="item item-input item-stacked-label"
          ><span class="input-label">Bairro</span
          ><input type="text" ng-model="perfil.bairro" required
        /></label>
        <label class="item item-input item-stacked-label"
          ><span class="input-label">Cidade</span
          ><input type="text" ng-model="perfil.cidade" required
        /></label>
        <p class="erro" ng-if="perfilForm.$dirty && perfilForm.$invalid">
          Preencha todos os campos com dados válidos.
        </p>
        <button
          class="button button-positive button-block"
          ng-disabled="perfilForm.$invalid"
        >
          Salvar alterações
        </button>
      </form>
    </main></ion-content
  ></ion-view
>
